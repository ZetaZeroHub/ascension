# Static virtual host. TLS may terminate at the existing CDN, as on the author's host.
# If serving directly, configure your own valid TLS certificate before public use.
server {
    listen 80;
    server_name art.zzh.app;
    root /www/wwwroot/art.zzh.app/current/site;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; frame-src 'self' https://music.163.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    # Cloudflare provides the country hint. Browser language and explicit choices take priority.
    location = /locale.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"country":"$http_cf_ipcountry"}';
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(html|json)$ { expires -1; }
    location ~* \.(css|js|svg|webp|png|jpg|jpeg)$ { expires 1h; }
    location ~* \.(mp4|m4a|wav)$ { expires 1d; }
}
