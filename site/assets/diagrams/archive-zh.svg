<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">可以带走的制作资料</title><desc id="desc">图解说明，完整操作步骤见旁边的文字。</desc><rect width="980" height="500" fill="#e9e6dc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><g transform="translate(61 121) scale(2.05)"><path d="M8 22L73 12 90 20 151 8V101L91 113 73 105 8 116Z" fill="#f4f1e8" stroke="#66756f"/><path d="M73 12V105M90 20V113" stroke="#66756f"/><circle cx="113" cy="48" r="7" fill="#bc9656"/><path d="M17 43L59 37M17 58L50 53M102 78L133 71M102 91L138 84" stroke="#66756f"/><path d="M29 97L40 67 51 95Z" fill="#884c48"/></g><text x="68" y="78" font-size="26" fill="#233943" text-anchor="start" font-weight="400">打开一本制作笔记</text><path d="M467 64 L931 64" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="473" y="97" font-size="17" fill="#884c48" text-anchor="start" font-weight="400">01</text><text x="530" y="96" font-size="24" fill="#233943" text-anchor="start" font-weight="400">想法怎么变具体</text><text x="530" y="127" font-size="17" fill="#66756f" text-anchor="start" font-weight="400">故事设定 / 提示词</text><path d="M467 158 L931 158" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="473" y="191" font-size="17" fill="#884c48" text-anchor="start" font-weight="400">02</text><text x="530" y="190" font-size="24" fill="#233943" text-anchor="start" font-weight="400">画面怎么定下来</text><text x="530" y="221" font-size="17" fill="#66756f" text-anchor="start" font-weight="400">设计稿 / 原始参考图</text><path d="M467 252 L931 252" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="473" y="285" font-size="17" fill="#884c48" text-anchor="start" font-weight="400">03</text><text x="530" y="284" font-size="24" fill="#233943" text-anchor="start" font-weight="400">镜头怎么跑出来</text><text x="530" y="315" font-size="17" fill="#66756f" text-anchor="start" font-weight="400">工作流 / 模型清单</text><path d="M467 346 L931 346" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="473" y="379" font-size="17" fill="#884c48" text-anchor="start" font-weight="400">04</text><text x="530" y="378" font-size="24" fill="#233943" text-anchor="start" font-weight="400">节奏怎么接起来</text><text x="530" y="409" font-size="17" fill="#66756f" text-anchor="start" font-weight="400">剪辑时间线 / 切点对照</text><text x="70" y="448" font-size="19" fill="#66756f" text-anchor="start" font-weight="400">文件留给你，镜头可以重新长出来。</text></g></svg>