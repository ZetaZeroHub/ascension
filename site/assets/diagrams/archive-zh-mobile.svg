<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 700" role="img" aria-labelledby="title desc"><title id="title">可以带走的制作资料</title><desc id="desc">图解说明，完整操作步骤见旁边的文字。</desc><rect width="440" height="700" fill="#e9e6dc"/><g font-family="Arial, Microsoft YaHei, sans-serif"><g transform="translate(25 27) scale(0.75)"><path d="M18 17H103L134 47V115H18Z" fill="#f4f1e8" stroke="#66756f"/><path d="M103 17V47H134" fill="#d9d6ca" stroke="#66756f"/><path d="M33 60H113M33 73H99M33 86H108M33 99H75" stroke="#66756f"/><rect x="2" y="2" width="46" height="24" fill="#315c70"/></g><text x="177" y="65" font-size="15" fill="#66756f" text-anchor="start" font-weight="400">TAKE A LOOK INSIDE</text><text x="177" y="102" font-size="24" fill="#233943" text-anchor="start" font-weight="400">制作笔记</text><path d="M30 174 L410 174" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="32" y="205" font-size="15" fill="#884c48" text-anchor="start" font-weight="400">01</text><text x="89" y="204" font-size="22" fill="#233943" text-anchor="start" font-weight="400">想法怎么变具体</text><text x="89" y="235" font-size="15" fill="#66756f" text-anchor="start" font-weight="400">故事设定 / 提示词</text><path d="M30 276 L410 276" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="32" y="307" font-size="15" fill="#884c48" text-anchor="start" font-weight="400">02</text><text x="89" y="306" font-size="22" fill="#233943" text-anchor="start" font-weight="400">画面怎么定下来</text><text x="89" y="337" font-size="15" fill="#66756f" text-anchor="start" font-weight="400">设计稿 / 原始参考图</text><path d="M30 378 L410 378" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="32" y="409" font-size="15" fill="#884c48" text-anchor="start" font-weight="400">03</text><text x="89" y="408" font-size="22" fill="#233943" text-anchor="start" font-weight="400">镜头怎么跑出来</text><text x="89" y="439" font-size="15" fill="#66756f" text-anchor="start" font-weight="400">工作流 / 模型清单</text><path d="M30 480 L410 480" stroke="#66756f" stroke-width="1.5" fill="none"/><text x="32" y="511" font-size="15" fill="#884c48" text-anchor="start" font-weight="400">04</text><text x="89" y="510" font-size="22" fill="#233943" text-anchor="start" font-weight="400">节奏怎么接起来</text><text x="89" y="541" font-size="15" fill="#66756f" text-anchor="start" font-weight="400">剪辑时间线 / 切点对照</text><text x="30" y="652" font-size="16" fill="#66756f" text-anchor="start" font-weight="400">不含模型权重和原始视频素材。</text></g></svg>